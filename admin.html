<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Inquiry Desk · H.X.S.N</title><link rel="stylesheet" href="/style.css"><style>
body{background:#090708;color:#f7f3f4;font-family:Inter,system-ui,sans-serif}.admin-shell{max-width:1180px;margin:auto;padding:36px 20px}.admin-top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.admin-kicker{color:#ff7180;font-size:11px;letter-spacing:.16em;font-weight:800}.admin-top h1{margin:8px 0 0;font-size:clamp(28px,5vw,48px)}.admin-card{background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:18px;padding:24px}.admin-login{max-width:440px;margin:12vh auto}.admin-form{display:grid;gap:14px}.admin-form label{display:grid;gap:7px;color:#bcb1b5;font-size:12px}.admin-form input,.admin-toolbar input,.admin-toolbar select,.inquiry-row select{background:#171114;border:1px solid rgba(255,255,255,.14);border-radius:9px;color:#fff;padding:12px}.admin-button{border:0;border-radius:9px;padding:12px 16px;background:#ff596b;color:#fff;font-weight:800;cursor:pointer}.admin-button.secondary{background:rgba(255,255,255,.1)}.admin-toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:18px}.admin-toolbar input{flex:1;min-width:180px}.inquiry-list{display:grid;gap:12px}.inquiry-row{display:grid;grid-template-columns:1.1fr 1.5fr 1fr 150px;gap:14px;align-items:center;border-top:1px solid rgba(255,255,255,.08);padding:16px 0}.inquiry-row strong{display:block}.inquiry-row small{color:#9d9095}.admin-error{color:#ff9aa4;min-height:20px}.admin-empty{padding:38px;text-align:center;color:#a79ba0}@media(max-width:760px){.inquiry-row{grid-template-columns:1fr}.admin-top{align-items:flex-start;flex-direction:column}}
</style></head><body><main class="admin-shell"><section id="loginCard" class="admin-card admin-login"><p class="admin-kicker">PRIVATE WORKSPACE</p><h1>Inquiry Desk</h1><p>Sign in with an administrator account to review project enquiries.</p><form id="loginForm" class="admin-form"><label>Email<input type="email" name="email" required autocomplete="username"></label><label>Password<input type="password" name="password" required autocomplete="current-password"></label><p id="loginError" class="admin-error" role="alert"></p><button class="admin-button" type="submit">SIGN IN SECURELY</button></form></section><section id="dashboard" hidden><header class="admin-top"><div><p class="admin-kicker">H.X.S.N DIGITAL TECHNOLOGIES</p><h1>Project inquiries</h1></div><button id="signOut" class="admin-button secondary" type="button">SIGN OUT</button></header><div class="admin-card"><div class="admin-toolbar"><input id="search" type="search" placeholder="Search name, email, reference…" aria-label="Search inquiries"><select id="status" aria-label="Filter by status"><option value="">All statuses</option><option>new</option><option>contacted</option><option>qualified</option><option>converted</option><option>archived</option></select><button id="refresh" class="admin-button" type="button">REFRESH</button></div><p id="dashboardError" class="admin-error" role="alert"></p><div id="inquiries" class="inquiry-list" aria-live="polite"></div></div></section></main><script>
(() => { const $=s=>document.querySelector(s), loginCard=$('#loginCard'), dashboard=$('#dashboard'), loginForm=$('#loginForm'), loginError=$('#loginError'), error=$('#dashboardError'), list=$('#inquiries'); let token=sessionStorage.getItem('hxsn_admin_token');
const escape=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
async function load(){ error.textContent=''; list.innerHTML='<p class="admin-empty">Loading secure records…</p>'; const qs=new URLSearchParams({search:$('#search').value,status:$('#status').value}); const res=await fetch('/api/admin-inquiries?'+qs,{headers:{Authorization:'Bearer '+token}}); const data=await res.json().catch(()=>({})); if(!res.ok){error.textContent=data.error||'Unable to load inquiries.';list.innerHTML='';return} list.innerHTML=data.inquiries.length?data.inquiries.map(i=>`<article class="inquiry-row"><div><strong>${escape(i.project_title)}</strong><small>${escape(i.reference_id)} · ${escape(i.full_name)}</small></div><div><strong>${escape(i.email)}</strong><small>${escape(i.project_type)} · ${escape(i.budget||'Budget not set')}</small></div><div><small>${escape(i.description).slice(0,150)}</small></div><select data-id="${escape(i.id)}" aria-label="Status for ${escape(i.reference_id)}">${['new','contacted','qualified','converted','archived'].map(s=>`<option ${s===i.status?'selected':''}>${s}</option>`).join('')}</select></article>`).join(''):'<p class="admin-empty">No inquiries match this view.</p>'; list.querySelectorAll('select').forEach(s=>s.addEventListener('change',async()=>{const res=await fetch('/api/admin-inquiries',{method:'PATCH',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({id:s.dataset.id,status:s.value})});if(!res.ok){error.textContent='Status update failed.';load()}}));}
function show(){loginCard.hidden=true;dashboard.hidden=false;load()} loginForm.addEventListener('submit',async e=>{e.preventDefault();loginError.textContent='';const res=await fetch('/api/admin-auth',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(loginForm)))});const data=await res.json().catch(()=>({}));if(!res.ok){loginError.textContent=data.error||'Sign-in failed.';return}token=data.accessToken;sessionStorage.setItem('hxsn_admin_token',token);show()});$('#signOut').onclick=()=>{sessionStorage.removeItem('hxsn_admin_token');token=null;dashboard.hidden=true;loginCard.hidden=false};$('#refresh').onclick=load;$('#search').oninput=()=>load();$('#status').onchange=load;if(token)show(); })();
</script></body></html>
