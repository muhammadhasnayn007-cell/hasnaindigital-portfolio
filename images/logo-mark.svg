<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 120" role="img" aria-labelledby="markTitle">
  <title id="markTitle">H.X.S.N Emblem</title>
  <defs>
    <!-- Rich Gold Metallic Gradient -->
    <linearGradient id="mGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8c958" />
      <stop offset="28%" stop-color="#e9a933" />
      <stop offset="70%" stop-color="#cb8318" />
      <stop offset="100%" stop-color="#af690d" />
    </linearGradient>

    <!-- Vibrant Gold Ribbon Gradient -->
    <linearGradient id="mGoldRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d68c17" />
      <stop offset="35%" stop-color="#f5bf46" />
      <stop offset="75%" stop-color="#fbd979" />
      <stop offset="100%" stop-color="#f0b236" />
    </linearGradient>

    <!-- Platinum / Metallic Silver Gradient -->
    <linearGradient id="mSilverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e6eaef" />
      <stop offset="80%" stop-color="#c1c7d0" />
      <stop offset="100%" stop-color="#9ea5b0" />
    </linearGradient>
  </defs>

  <!-- Left Stem of H -->
  <path d="M 28 28 L 52 16 L 52 90 L 28 102 Z" fill="url(#mGoldGrad)" />

  <!-- Right Stem of H -->
  <path d="M 74 28 L 98 16 L 98 90 L 74 102 Z" fill="url(#mSilverGrad)" />

  <!-- Dynamic Ascending Growth Arrow Swoosh -->
  <path d="M 12 72 
           C 14 88, 38 92, 54 84 
           C 74 74, 98 56, 114 36 
           L 106 32 
           C 90 52, 68 68, 48 74 
           C 32 78, 20 74, 18 64 
           C 16 54, 24 48, 28 46 
           L 26 40 
           C 18 44, 10 56, 12 72 Z" 
        fill="url(#mGoldRibbon)" />

  <path d="M 30 76 
           C 48 76, 76 64, 108 34 
           L 98 28 
           L 124 24 
           L 122 50 
           L 112 44 
           C 86 68, 56 84, 30 84 Z" 
        fill="url(#mGoldRibbon)" />
</svg>
