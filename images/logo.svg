<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 435 120" role="img" aria-labelledby="logoTitle logoDesc">
  <title id="logoTitle">H.X.S.N Digital Marketer</title>
  <desc id="logoDesc">Official H.X.S.N Digital Marketer Brand Logo</desc>
  <defs>
    <!-- Rich Gold Metallic Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8c958" />
      <stop offset="28%" stop-color="#e9a933" />
      <stop offset="70%" stop-color="#cb8318" />
      <stop offset="100%" stop-color="#af690d" />
    </linearGradient>

    <!-- Vibrant Gold Ribbon Gradient -->
    <linearGradient id="goldRibbon" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d68c17" />
      <stop offset="35%" stop-color="#f5bf46" />
      <stop offset="75%" stop-color="#fbd979" />
      <stop offset="100%" stop-color="#f0b236" />
    </linearGradient>

    <!-- Platinum / Metallic Silver Gradient -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="40%" stop-color="#e6eaef" />
      <stop offset="80%" stop-color="#c1c7d0" />
      <stop offset="100%" stop-color="#9ea5b0" />
    </linearGradient>

    <!-- Soft Ambient Glow / Shadow -->
    <filter id="softGlow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.45" />
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <!-- LEFT STEM OF H (Gold Angled Pillar) -->
    <path d="M 28 28 L 52 16 L 52 90 L 28 102 Z" fill="url(#goldGrad)" />

    <!-- RIGHT STEM OF H (Silver Angled Pillar) -->
    <path d="M 74 28 L 98 16 L 98 90 L 74 102 Z" fill="url(#silverGrad)" />

    <!-- DYNAMIC SWOOSH / ASCENDING GROWTH ARROW -->
    <!-- Ribbon wrapping around left stem and cutting across center to top right -->
    <path d="M 12 72 
             C 14 88, 38 92, 54 84 
             C 74 74, 98 56, 114 36 
             L 106 32 
             C 90 52, 68 68, 48 74 
             C 32 78, 20 74, 18 64 
             C 16 54, 24 48, 28 46 
             L 26 40 
             C 18 44, 10 56, 12 72 Z" 
          fill="url(#goldRibbon)" />

    <!-- Main Dynamic Arrow Crest at Top Right -->
    <path d="M 30 76 
             C 48 76, 76 64, 108 34 
             L 98 28 
             L 124 24 
             L 122 50 
             L 112 44 
             C 86 68, 56 84, 30 84 Z" 
          fill="url(#goldRibbon)" />

    <!-- VERTICAL DIVIDER LINE -->
    <line x1="138" y1="20" x2="138" y2="98" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />

    <!-- WORDMARK: H.X.S.N -->
    <text x="156" y="66" 
          font-family="Inter, Montserrat, 'Segoe UI', system-ui, sans-serif" 
          font-size="46" 
          font-weight="900" 
          letter-spacing="5" 
          fill="url(#goldGrad)">H.X.S.N</text>

    <!-- SUBTITLE: Digital Marketer -->
    <text x="158" y="94" 
          font-family="Inter, 'Segoe UI', system-ui, sans-serif" 
          font-size="20" 
          font-weight="600" 
          letter-spacing="2" 
          fill="#f6f3ee" 
          opacity="0.95">Digital Marketer</text>
  </g>
</svg>
